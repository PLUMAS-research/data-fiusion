[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-fiusion"
version = "0.1.0"
description = "Sparse data fusion by non-negative matrix tri-factorization."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "pandas>=1.5",
    "cytoolz>=0.12",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5", "seaborn>=0.12"]

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
